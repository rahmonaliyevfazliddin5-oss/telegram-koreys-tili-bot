services:
  postgres:
    image: postgres:16-alpine
    container_name: course_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: course_bot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

  redis:
    image: redis:7-alpine
    container_name: course_bot_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bot_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: course_bot_app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bot_network

  # 1-variant: O'z domeniga ega bo'lganlar uchun (Caddy - avtomatik HTTPS)
  proxy:
    image: caddy:2-alpine
    container_name: course_bot_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - bot_network

  # 2-variant: Domen bo'lmagan holatda Cloudflare Tunnel (kerak bo'lsa yoqiladi)
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: course_bot_cloudflared
  #   restart: unless-stopped
  #   command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - app
  #   networks:
  #     - bot_network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  bot_network:
    driver: bridge
